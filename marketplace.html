<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marketplace</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- CSS של האתר -->
    <link rel="stylesheet" href="style.css">
</head>


<body class="bg-light">

<div id="sharedNavigation"></div>

<main class="marketplace-main">



    <div class="marketplace-header">

        <div
            class="d-flex justify-content-between align-items-center flex-wrap gap-3"
        >

            <div>

                <h2 class="mb-1">
                    הבחירות של היום
                </h2>

                <div class="text-muted">
                    מוצרים למכירה ב-Marketplace
                </div>

            </div>


            <!-- יצירת מודעה -->

            <button
                type="button"
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#createMarketplaceItemModal"
            >
                <i class="bi bi-plus-lg"></i>
                יצירת מודעה חדשה
            </button>

        </div>

    </div>



    <!-- =================================================
         כל המודעות
    ================================================== -->

    <div
        id="marketplaceItemsContainer"
        class="marketplace-grid"
    >

        <div class="text-muted">
            טוען מודעות...
        </div>

    </div>


</main>



<!-- =====================================================
     חלונית יצירת מודעה חדשה
===================================================== -->

<div
    class="modal fade"
    id="createMarketplaceItemModal"
    tabindex="-1"
    aria-labelledby="createMarketplaceItemModalLabel"
    aria-hidden="true"
>

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">


            <!-- כותרת החלונית -->

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="createMarketplaceItemModalLabel"
                >
                    יצירת מודעה חדשה
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>

            </div>



            <!-- תוכן החלונית -->

            <div class="modal-body">


                <form id="createMarketplaceItemForm">


                    <!-- שם מוצר -->

                    <div class="mb-3">

                        <label
                            for="marketplaceItemName"
                            class="form-label"
                        >
                            שם המוצר
                        </label>

                        <input
                            type="text"
                            id="marketplaceItemName"
                            class="form-control"
                            required
                        >

                    </div>



                    <!-- מחיר -->

                    <div class="mb-3">

                        <label
                            for="marketplaceItemPrice"
                            class="form-label"
                        >
                            מחיר המוצר
                        </label>


                        <div class="input-group">

                            <input
                                type="number"
                                id="marketplaceItemPrice"
                                class="form-control"
                                min="0"
                                step="1"
                                required
                            >

                            <span class="input-group-text">
                                ₪
                            </span>

                        </div>

                    </div>



                    <!-- מיקום -->

                    <div class="mb-3">

                        <label
                            for="marketplaceItemLocation"
                            class="form-label"
                        >
                            מיקום המוצר
                        </label>

                        <input
                            type="text"
                            id="marketplaceItemLocation"
                            class="form-control"
                            placeholder="לדוגמה: ראשון לציון"
                        >

                    </div>



                    <!-- תיאור -->

                    <div class="mb-3">

                        <label
                            for="marketplaceItemDescription"
                            class="form-label"
                        >
                            תיאור המוצר
                        </label>

                        <textarea
                            id="marketplaceItemDescription"
                            class="form-control"
                            rows="4"
                            placeholder="ספר קצת על המוצר..."
                        ></textarea>

                    </div>



                    <!-- תמונה -->

                    <div class="mb-3">

                        <label
                            for="marketplaceItemImage"
                            class="form-label"
                        >
                            תמונת המוצר
                        </label>

                        <input
                            type="file"
                            id="marketplaceItemImage"
                            class="form-control"
                            accept="image/*"
                        >

                    </div>



                    <!-- Preview -->

                    <div
                        id="marketplaceImagePreviewContainer"
                        class="mb-3"
                        hidden
                    >

                        <img
                            id="marketplaceImagePreview"
                            src=""
                            alt="תצוגה מקדימה של המוצר"
                            class="img-fluid rounded"
                        >

                    </div>



                    <!-- כפתור פרסום -->

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        <i class="bi bi-plus-circle"></i>
                        פרסם מודעה
                    </button>


                </form>


            </div>

        </div>

    </div>

</div>



<!-- =====================================================
     חלונית צפייה במודעה
===================================================== -->

<div
    class="modal fade"
    id="marketplaceItemModal"
    tabindex="-1"
    aria-labelledby="modalItemName"
    aria-hidden="true"
>

    <div
        class="modal-dialog modal-lg modal-dialog-centered"
    >

        <div class="modal-content">


            <!-- כותרת -->

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="modalItemName"
                >
                    פרטי המוצר
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>

            </div>



            <!-- תוכן -->

            <div class="modal-body">

                <div class="row g-4">


                    <!-- תמונה -->

                    <div class="col-md-7">

                        <img
                            id="modalItemImage"
                            src=""
                            alt="Product"
                            class="marketplace-modal-image"
                        >

                    </div>



                    <!-- פרטים -->

                    <div class="col-md-5">


                        <!-- מחיר -->

                        <h3
                            id="modalItemPrice"
                            class="mb-2"
                        ></h3>


                        <!-- שם -->

                        <h5
                            id="modalItemTitle"
                            class="mb-2"
                        ></h5>


                        <!-- מיקום -->

                        <div
                            id="modalItemLocation"
                            class="text-muted mb-3"
                        ></div>


                        <hr>


                        <!-- תיאור -->

                        <h6>
                            תיאור
                        </h6>

                        <p
                            id="modalItemDescription"
                            class="text-muted"
                        ></p>


                        <hr>


                        <!-- מוכר -->

                        <div
                            class="d-flex align-items-center gap-2 mb-3"
                        >

                            <img
                                id="modalSellerImage"
                                src="harel.jpg"
                                alt="Seller"
                                class="rounded-circle"
                                width="45"
                                height="45"
                            >

                            <div>

                                <div class="small text-muted">
                                    פרטי המוכר
                                </div>

                                <strong
                                    id="modalSellerName"
                                ></strong>

                            </div>

                        </div>



                        <!-- הודעה למוכר -->

                        <button
                            type="button"
                            id="messageSellerBtn"
                            class="btn btn-primary w-100"
                        >
                            <i class="bi bi-chat-dots-fill"></i>
                            שלח הודעה למוכר
                        </button>


                    </div>

                </div>

            </div>

        </div>

    </div>

</div>



<!-- =====================================================
     JavaScript
===================================================== -->

<!-- Bootstrap JS חייב להיות לפני marketplace.js -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>
<script src="navigation.js"></script>
<script src="marketplace.js"></script>


</body>
</html>
