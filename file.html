<!DOCTYPE html> <!-- harel-dadon-318988326 -->
<html lang="he" dir="rtl">
    <title>Facebook - Feed</title>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div id="sharedNavigation"></div>

<div class="container mt-4">
    <div class="row">

        <div class="col-lg-3 d-none d-lg-block"></div>

        
        <div class="col-lg-6">

    <div class="card mb-4">
        <div class="card-body">

            <div class="d-flex align-items-center gap-2 mb-2">

                <img
                    src="facebookprofile.jpeg"
                    alt="Profile"
                    class="rounded-circle current-user-profile-image"
                    width="45"
                    height="45"
                    style="object-fit: cover;"
                >

                <input
                    type="text"
                    id="postText"
                    class="form-control"
                    placeholder="מה בא לך לשתף?"
                >

                <button
                    type="button"
                    id="publishPostBtn"
                    class="btn btn-primary"
                >
                    פרסם
                </button>

                <button
                    type="button"
                    class="btn btn-light"
                    id="selectPostImageBtn"
                    title="הוסף תמונה"
                >
                    <i class="bi bi-file-earmark-image"></i>
                </button>

                <button
                    type="button"
                    class="btn btn-light"
                    id="selectPostVideoBtn"
                    title="הוסף סרטון"
                >
                    <i class="bi bi-camera-video-fill"></i>
                </button>

                <button
                    type="button"
                    class="btn btn-light"
                    id="selectPostFeelingBtn"
                    title="הוסף הרגשה"
                >
                    <i class="bi bi-emoji-smile"></i>
                </button>

            </div>


            <input
                type="file"
                id="postImageInput"
                accept="image/*"
                style="display: none;"
            >

            <input
                type="file"
                id="postVideoInput"
                accept="video/*"
                style="display: none;"
            >


            <div
                id="selectedPostFile"
                class="text-muted small mb-2"
            ></div>


            <div
                id="feelingsMenu"
                class="card shadow p-3 mt-2"
                style="display: none;"
            >

                <div class="fw-bold mb-2">
                    איך אתה מרגיש?
                </div>

                <div class="d-flex flex-wrap gap-2">

                    <button type="button" class="btn btn-light feeling-option" data-feeling="😊 שמח">😊 שמח</button>

                    <button type="button" class="btn btn-light feeling-option" data-feeling="😁 מאושר">😁 מאושר</button>

                    <button type="button" class="btn btn-light feeling-option" data-feeling="😍 מאוהב">😍 מאוהב</button>

                    <button type="button" class="btn btn-light feeling-option" data-feeling="🤩 נרגש">🤩 נרגש</button>

                    <button type="button" class="btn btn-light feeling-option" data-feeling="🥳 חוגג">🥳 חוגג</button>

                    <button type="button" class="btn btn-light feeling-option" data-feeling="😌 רגוע">😌 רגוע</button>

                    <button type="button" class="btn btn-light feeling-option" data-feeling="🤗 אסיר תודה">🤗 אסיר תודה</button>

                    <button type="button" class="btn btn-light feeling-option" data-feeling="💪 חזק">💪 חזק</button>

                    <button type="button" class="btn btn-light feeling-option" data-feeling="🤔 חושב">🤔 חושב</button>

                    <button type="button" class="btn btn-light feeling-option" data-feeling="😴 עייף">😴 עייף</button>

                    <button type="button" class="btn btn-light feeling-option" data-feeling="😰 לחוץ">😰 לחוץ</button>

                    <button type="button" class="btn btn-light feeling-option" data-feeling="😟 מודאג">😟 מודאג</button>

                    <button type="button" class="btn btn-light feeling-option" data-feeling="😢 עצוב">😢 עצוב</button>

                    <button type="button" class="btn btn-light feeling-option" data-feeling="😭 שבור">😭 שבור</button>

                    <button type="button" class="btn btn-light feeling-option" data-feeling="😡 כועס">😡 כועס</button>

                    <button type="button" class="btn btn-light feeling-option" data-feeling="😤 מתוסכל">😤 מתוסכל</button>

                    <button type="button" class="btn btn-light feeling-option" data-feeling="🤒 לא מרגיש טוב">🤒 לא מרגיש טוב</button>

                    <button type="button" class="btn btn-light feeling-option" data-feeling="😱 מופתע">😱 מופתע</button>

                    <button type="button" class="btn btn-light feeling-option" data-feeling="😇 מבורך">😇 מבורך</button>

                    <button type="button" class="btn btn-light feeling-option" data-feeling="🙏 מלא תקווה">🙏 מלא תקווה</button>

                </div>

            </div>

        </div>
    </div>
             <div id="postsContainer"></div>
            <div class="card mb-4">
                <div class="card-body">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        
                    </div>  
                </div>
            </div>
        </div>
        <div class="col-lg-3 d-none d-lg-block">
<div class="card shadow-sm border-0 rounded-4 mb-4">

    <div class="card-body">

        <h5 class="mb-3">
            <i class="bi bi-cloud-sun-fill text-primary"></i>
            מזג האוויר
        </h5>

        <div class="input-group mb-3">

            <input
                type="text"
                id="weatherCityInput"
                class="form-control"
                placeholder="הכנס עיר..."
                autocomplete="off"
            >

            <button
                type="button"
                id="weatherSearchBtn"
                class="btn btn-primary"
            >
                <i class="bi bi-search"></i>
            </button>

        </div>

        <div
            id="weatherResult"
            class="text-center"
        >
            <div class="text-muted small">
                חפש עיר כדי לראות את מזג האוויר
            </div>
        </div>

    </div>

</div>
<div class="card-body">

    <h6 class="card-title">
        <i class="bi bi-gift-fill text-primary"></i>
        ימי הולדת
    </h6>

    <a
        href="birthdays.html"
        id="todayBirthdaysLink"
        class="text-decoration-none text-dark"
        style="display: none;"
    >
        <div id="todayBirthdaysContent"></div>
    </a>

    <div
        id="noBirthdaysToday"
        class="text-muted small"
    >
        אין ימי הולדת היום
    </div>

</div>
    </div>
</div>
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="navigation.js"></script>
<script src="Post.js"></script>

</body>
</html>
