<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>חברים</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <div id="sharedNavigation"></div>

    <main class="shared-page-main">

        <div class="container py-4">

            <div class="mb-4">

                <h2 class="mb-1">
                    חברים
                </h2>

                <div class="text-muted">
                    ניהול החברים ובקשות החברות שלך
                </div>

            </div>


            <!-- טאבים -->

            <div class="card mb-4">

                <div class="d-flex border-bottom">

                    <button
                        type="button"
                        id="friendRequestsTab"
                        class="btn flex-fill py-3 rounded-0 border-0 fw-bold text-primary"
                    >
                        <i class="bi bi-person-plus-fill ms-1"></i>
                        בקשות חברות

                        <span
                            id="friendRequestsCount"
                            class="badge bg-danger me-1"
                            hidden
                        >
                            0
                        </span>
                    </button>


                    <button
                        type="button"
                        id="allFriendsTab"
                        class="btn flex-fill py-3 rounded-0 border-0 fw-bold text-secondary"
                    >
                        <i class="bi bi-people-fill ms-1"></i>
                        הכל
                    </button>

                </div>


                <!-- בקשות חברות -->

                <div
                    id="friendRequestsSection"
                    class="p-4"
                >

                    <h4 class="mb-3">
                        בקשות חברות
                    </h4>

                    <div id="friendRequestsContainer">

                        <div class="text-muted">
                            טוען בקשות חברות...
                        </div>

                    </div>

                </div>


                <!-- כל החברים -->

                <div
                    id="allFriendsSection"
                    class="p-4"
                    hidden
                >

                    <h4 class="mb-3">
                        כל החברים
                    </h4>

                    <div id="friendsContainer"></div>

                </div>

            </div>

        </div>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="navigation.js"></script>
    <script src="friends.js"></script>

</body>

</html>
