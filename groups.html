<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קבוצות</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <div class="container py-5">

        <h2 class="mb-4">קבוצות</h2>

        <a href="file.html" class="btn btn-outline-primary position-absolute top-0 start-0 m-3">
                <i class="bi bi-house-door"></i>
                חזרה לדף הבית
            </a>

        <div class="card p-4 mb-4">
            <h4 class="mb-3">יצירת קבוצה חדשה</h4>

            <form id="createGroupForm">

                <div class="mb-3">
                    <label for="groupName" class="form-label">שם הקבוצה</label>
                    <input type="text" id="groupName" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="groupDescription" class="form-label">תיאור</label>
                    <textarea id="groupDescription" class="form-control" rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label for="groupAddress" class="form-label">כתובת</label>
                    <input type="text" id="groupAddress" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary">
                    צור קבוצה
                </button>

            </form>
        </div>

        <div class="card p-4 mb-4">
    <h4 class="mb-3">הקבוצות שלי</h4>
    <div id="myGroupsContainer"></div>
</div>

<h4 class="mb-3">כל הקבוצות</h4>

        <div id="groupsContainer"></div>

    </div>

    <div class="modal fade" id="groupPostModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">פרסום פוסט בקבוצה</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <textarea
                    id="groupPostText"
                    class="form-control"
                    rows="4"
                    placeholder="מה בא לך לשתף בקבוצה?"></textarea>

                <input type="hidden" id="groupPostGroupId">
            </div>

            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    ביטול
                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    id="publishGroupPostBtn">
                    פרסם
                </button>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="groups.js"></script>
</body>
</html>
