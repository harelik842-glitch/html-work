<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>קבוצות</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <!-- ניווט משותף -->
    <div id="sharedNavigation"></div>


    <!-- תוכן העמוד -->
    <main class="shared-page-main">

        <div class="container py-4">

            <!-- כותרת -->
            <div
                class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4"
            >

                <div>
                    <h2 class="mb-1">
                        קבוצות
                    </h2>

                    <div class="text-muted">
                        הקבוצות שלך וקבוצות שאולי יעניינו אותך
                    </div>
                </div>


                <a
                    href="create-group.html"
                    class="btn btn-primary"
                >
                    <i class="bi bi-plus-circle"></i>
                    צור קבוצה חדשה
                </a>

            </div>


            <!-- חיפוש קבוצות -->
            <div class="mb-4">

                <div
                    class="position-relative"
                    style="max-width: 420px;"
                >

                    <div class="input-group">

                        <span class="input-group-text bg-white">
                            <i class="bi bi-search"></i>
                        </span>

                        <input
                            type="text"
                            id="groupsSearchInput"
                            class="form-control"
                            placeholder="חפש קבוצה..."
                            autocomplete="off"
                        >

                    </div>


                    <div
                        id="groupsSearchResults"
                        class="position-absolute bg-white border rounded shadow w-100 mt-1"
                        style="
                            display: none;
                            z-index: 2000;
                            max-height: 400px;
                            overflow-y: auto;
                        "
                    ></div>

                </div>

            </div>


            <!-- תוכן קבוצות -->
            <div class="row g-4">


                <!-- צד ימין -->
                <div class="col-lg-4">


                    <!-- הקבוצות שלי -->
                    <div class="card mb-4">

                        <div class="card-body">

                            <h4 class="mb-3">
                                הקבוצות שלי
                            </h4>

                            <div id="myGroupsContainer"></div>

                        </div>

                    </div>


                    <!-- קבוצות חדשות -->
                    <div class="card">

                        <div class="card-body">

                            <h4 class="mb-3">
                                קבוצות שאולי יעניינו אותך
                            </h4>

                            <div id="discoverGroupsContainer"></div>

                        </div>

                    </div>

                </div>


                <!-- צד שמאל -->
                <div class="col-lg-8">

                    <div class="card">

                        <div class="card-body">

                            <h3 class="mb-4">
                                פוסטים מהקבוצות שלי
                            </h3>

                            <div id="groupsFeedContainer"></div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- ניווט משותף -->
    <script src="navigation.js"></script>

    <!-- הלוגיקה של עמוד הקבוצות -->
    <script src="groups.js"></script>

</body>

</html>
