<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>השלמת הרשמה</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">

    <div
        class="card shadow p-4"
        style="max-width: 500px; width: 100%;"
    >

        <h2 class="text-center mb-2">
            כמעט סיימנו
        </h2>

        <p class="text-center text-muted mb-4">
            הוסף תמונת פרופיל ותמונת נושא
        </p>

        <form id="registerStep2Form">


            <div class="mb-4 text-center">

                <label class="form-label fw-semibold d-block">
                    תמונת פרופיל
                </label>

                <img
                    id="profilePreview"
                    src="facebookprofile.jpeg"
                    alt="Profile"
                    class="rounded-circle border mb-3"
                    width="120"
                    height="120"
                    style="object-fit: cover;"
                >

                <input
                    type="file"
                    id="registerProfileImage"
                    class="form-control"
                    accept="image/*"
                >

            </div>



            <div class="mb-4">

                <label class="form-label fw-semibold">
                    תמונת נושא
                </label>

                <div
                    class="bg-secondary-subtle rounded overflow-hidden mb-3"
                    style="height: 170px;"
                >

                    <img
                        id="coverPreview"
                        src=""
                        alt="Cover"
                        style="
                            width: 100%;
                            height: 100%;
                            object-fit: cover;
                            display: none;
                        "
                    >

                </div>

                <input
                    type="file"
                    id="registerCoverImage"
                    class="form-control"
                    accept="image/*"
                >

            </div>


            <button
                type="submit"
                class="btn btn-success w-100"
            >
                הרשמה
            </button>

            <a
                href="register.html"
                class="btn btn-outline-secondary w-100 mt-2"
            >
                חזרה
            </a>

        </form>

    </div>

</div>

<script src="register-step2.js"></script>

</body>
</html>
