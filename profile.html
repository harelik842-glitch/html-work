<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>הפרופיל שלי</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <div class="container-fluid p-0">

        <div class="profile-page">

           

                

            </div>
 </div>

 <div class="profile-cover-wrapper">

    <img
        src="harel.jpg"
        alt="Cover"
        id="coverImage"
        class="profile-cover"
    >

    <button class="cover-edit-btn" id="editCoverBtn">
        <i class="bi bi-camera"></i>
        עריכת תמונת נושא
    </button>

</div>

 <div class="profile-info-wrapper">

    <div class="profile-avatar-wrapper">
        <img
            src="harel.jpg"
            alt="Profile"
            class="profile-avatar"
            id="profileImage"
        >

        <button
            class="profile-image-edit-btn"
            id="editProfileImageBtn">
            <i class="bi bi-camera"></i>
        </button>
    </div>

    <div class="profile-main-info">
        <h1 id="profileName"></h1>

        <div class="profile-meta-line">
            <span>
                <i class="bi bi-people-fill"></i>
                <span id="friendsCount">0</span>
                חברים
            </span>

            <span>
                <i class="bi bi-geo-alt-fill"></i>
                <span id="profileCity"></span>
            </span>
        </div>
    </div>

    <div class="profile-actions">
        <button
            class="btn btn-primary px-4"
            id="editProfileBtn">
            <i class="bi bi-pencil"></i>
            עריכת פרופיל
        </button>

        <a
            href="file.html"
            class="btn btn-outline-secondary px-4">
            <i class="bi bi-house-door"></i>
            חזרה לדף הבית
        </a>
    </div>

</div>

           <div class="profile-tabs">

    <button class="profile-tab active" id="postsTab">
        פוסטים
    </button>

    <button class="profile-tab">
        אודות
    </button>

    <button class="profile-tab" id="friendsTab">
        חברים
    </button>

    <button class="profile-tab"  id="groupsTab">
        קבוצות
    </button>

</div>

        </div>

        <div class="container mt-4">

            <div class="row">

                <div class="col-lg-8">

                    <div class="card shadow-sm border-0 rounded-4 p-4">
                        <div class="card mb-4">
    <div class="card-body">

        <div class="d-flex align-items-center gap-3">

            <img
                id="createPostProfileImage"
                src="harel.jpg"
                alt="Profile"
                class="rounded-circle"
                width="45"
                height="45"
                style="object-fit: cover;"
            >

            <input
                type="text"
                id="profilePostInput"
                class="form-control rounded-pill"
                placeholder="על מה אתה חושב?"
            >

            <button
                class="btn btn-primary"
                id="createProfilePostBtn"
            >
                פרסם
            </button>
<button class="btn btn-light"><i class="bi bi-file-earmark-image"></i></button>
                        <button class="btn btn-light"><i class="bi bi-camera-video-fill"></i></button>
                        <button class="btn btn-light"><i class="bi bi-emoji-smile"></i></button>
        </div>

    </div>
</div>

                        <h3 class="mb-4" id="profileSectionTitle">
                            הפוסטים שלי
                        </h3>

                        <div id="myPostsContainer"></div>
                        <div id="profileFriendsContainer" style="display: none;"></div>
                        <div id="profileGroupsContainer" style="display: none;"></div>

                    </div>

                </div>

                <div class="col-lg-4">

                    <div class="card shadow-sm border-0 rounded-4 p-4">

                        <h4 class="mb-3">
                            פרטים
                        </h4>

                        <div class="profile-details">

    <div>
        <i class="bi bi-geo-alt-fill"></i>
        גר ב־
        <strong id="profileCitySide"></strong>
    </div>

    <div>
        <i class="bi bi-gift-fill"></i>
        יום הולדת
        <strong id="profileBirthday"></strong>
    </div>

</div>

                    </div>

                </div>

            </div>

        </div>

    </div>
<input
    type="file"
    id="profileImageInput"
    accept="image/*"
    style="display: none;"
>

<input
    type="file"
    id="coverImageInput"
    accept="image/*"
    style="display: none;"
>



    <script src="profile.js"></script>

</body>
</html>
