<!DOCTYPE html> <!-- harel-dadon-318988326 -->
<html lang="he" dir="rtl">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פייסבוק - התחברות או הרשמה</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container d-flex align-items-center justify-content-center vh-100">
    <div class="row w-100 align-items-center">
        
        <div class="col-md-6 text-center text-md-start mb-4 mb-md-0">
            <h1 class="text-primary fw-bold display-3 mb-2">facebook</h1>
            <h2 class="fs-4 fw-normal text-secondary" style="max-width: 500px;">
                פייסבוק עוזרת לך ליצור קשר ולשתף עם האנשים בחייך.
            </h2>
        </div>

        <div class="col-md-6 d-flex justify-content-center justify-content-md-end">
            
           <div class="p-4 bg-white rounded-3 shadow border-0" style="width: 100%; max-width: 400px;">
    <form id="loginForm" novalidate>
        <div class="mb-3">
            <input type="email" id="email" class="form-control form-control-lg fs-6" placeholder="אימייל או מספר טלפון" required>
            <div id="emailError" class="text-danger small mt-1"></div>
        </div>
        
        <div class="mb-3">
            <input type="password" id="password" class="form-control form-control-lg fs-6" placeholder="סיסמה" required>
            <div id="passwordError" class="text-danger small mt-1"></div>
        </div>
        
        <div class="d-grid gap-2 mb-3">
            <button class="btn btn-primary btn-lg fw-bold fs-5" type="submit">התחברות</button>
        </div>
        
        <div class="text-center mb-3">
            <a href="#" class="text-decoration-none small text-primary">שכחת את הסיסמה?</a>
        </div>
        
        <hr class="text-muted my-4">
        
        <div class="text-center">
           <a href="register.html">
    <button class="btn btn-success btn-lg fw-bold fs-6 px-4" type="button">יצירת חשבון חדש</button>
</a>
        </div>
    </form>
</div>
        

    </div>
</div>
<script src="login.js"></script>
</body>
</html>
