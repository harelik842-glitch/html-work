<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יצירת חשבון חדש</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow p-4" style="max-width: 500px; width: 100%;">

            <h2 class="text-center mb-4">יצירת חשבון חדש</h2>

            <form id="registerForm">

                <div class="mb-3">
                    <label for="username" class="form-label">שם משתמש</label>
                    <input type="text" id="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="firstName" class="form-label">שם פרטי</label>
                    <input type="text" id="firstName" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="lastName" class="form-label">שם משפחה</label>
                    <input type="text" id="lastName" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">אימייל</label>
                    <input type="email" id="email" class="form-control" required>
                </div>

               <div class="mb-3">
               <label for="city" class="form-label">עיר</label>

                <input
                type="text"
                id="city"
                class="form-control"
                 placeholder="התחל להקליד עיר..."
                autocomplete="off"
    >

                <div class="form-text">
                 יש לבחור עיר מתוך הרשימה
                </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">סיסמה</label>
                    <input type="password" id="password" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">אימות סיסמה</label>
                    <input type="password" id="confirmPassword" class="form-control" required>
                </div>

                <div class="mb-3">
                <label for="birthday" class="form-label">יום הולדת</label>
                <input
                 type="date" id="birthday" class="form-control">
                </div>

                <button type="submit" class="btn btn-success w-100">
                    הבא
                </button>

            </form>

        </div>
    </div>
<script src="register.js"></script>
<script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCgUq-RRtTa7u-JTt3JjJSuUyZZZw3ymf0&libraries=places&callback=initCityAutocomplete"async  defer>
</script>
</body>
</html>
