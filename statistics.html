<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>סטטיסטיקות</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="style.css">

    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body class="bg-light">

    <div id="sharedNavigation"></div>


    <main class="shared-page-main">

        <div class="container py-4">

            <div class="mb-4">

                <h2 class="mb-1">
                    <i class="bi bi-bar-chart-fill"></i>
                    סטטיסטיקות
                </h2>

                <div class="text-muted">
                    נתונים סטטיסטיים של הרשת החברתית
                </div>

            </div>


            <div class="card shadow-sm border-0 rounded-4 mb-4">

                <div class="card-body p-4">

                    <h4 class="mb-1">
                        מספר פוסטים לפי קבוצה
                    </h4>

                    <p class="text-muted mb-4">
                        מספר הפוסטים שפורסמו בכל אחת מהקבוצות
                    </p>

                    <div
                        id="postsByGroupChart"
                        style="
                            width: 100%;
                            overflow-x: auto;
                        "
                    ></div>

                </div>

            </div>


            <div class="card shadow-sm border-0 rounded-4">

                <div class="card-body p-4">

                    <h4 class="mb-1">
                        מספר משתמשים לפי עיר
                    </h4>

                    <p class="text-muted mb-4">
                        התפלגות המשתמשים הרשומים לפי עיר מגורים
                    </p>

                    <div
                        id="usersByCityChart"
                        style="
                            width: 100%;
                            overflow-x: auto;
                        "
                    ></div>

                </div>

            </div>

        </div>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="navigation.js"></script>

    <script src="statistics.js"></script>

</body>

</html>
