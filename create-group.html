<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>צור קבוצה חדשה</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2>צור קבוצה חדשה</h2>

            <a
                href="groups.html"
                class="btn btn-outline-secondary"
            >
                <i class="bi bi-arrow-right"></i>
                חזרה לקבוצות
            </a>

        </div>

        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">

                <form id="createGroupForm">

                    <div class="mb-3">
                        <label
                            for="groupName"
                            class="form-label"
                        >
                            שם הקבוצה
                        </label>

                        <input
                            type="text"
                            id="groupName"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label
                            for="groupDescription"
                            class="form-label"
                        >
                            תיאור הקבוצה
                        </label>

                        <textarea
                            id="groupDescription"
                            class="form-control"
                            rows="4"
                        ></textarea>
                    </div>

                    <div class="mb-3">
                        <label
                            for="groupImage"
                            class="form-label"
                        >
                            תמונת פרופיל לקבוצה
                        </label>

                        <input
                            type="file"
                            id="groupImage"
                            class="form-control"
                            accept="image/*"
                        >
                    </div>

                    <div class="mb-4 text-center">
                        <img
                            id="groupImagePreview"
                            src=""
                            alt="תצוגה מקדימה"
                            class="rounded-circle border"
                            width="120"
                            height="120"
                            style="
                                display: none;
                                object-fit: cover;
                            "
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        <i class="bi bi-plus-circle"></i>
                        צור קבוצה
                    </button>

                </form>

            </div>
        </div>

    </div>

    <script src="create-group.js"></script>

</body>
</html>
